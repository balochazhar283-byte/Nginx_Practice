services:
  app1:
    build: ./app1
    ports:
      - "8002:80"      # direct access to Container 1
    restart: always

  app2:
    build: ./app2
    ports:
      - "8001:80"      # direct access to Container 2
    restart: always

  loadbalancer:
    build: ./nginx
    ports:
      - "8000:80"        # main entry: alternates between app1 and app2
    depends_on:
      - app1
      - app2
    restart: always